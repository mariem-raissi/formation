 
<div class="container">

<div class="row p-2 g-3">
  @for(item of recettee ; track item.id){
  <div class="col-3 ">
    <div class="card">
        <img class="card-img-top" [src]="item.image" style="  height: 250px;" alt="Card image cap">
 
      <div class="card-body">
        <h5 class="card-title">{{item.titre}}</h5>
         
         <button class="btn btn-primary" [routerLink]="['/detail',item.id]">
            Voir les détails
        </button>
      </div>
    </div>
  </div>
  }
  
 </div>    
   
</div>
