 
<div class=" container  mt-4 w-50 shadow ">
    <form #signupF ="ngForm" (ngSubmit)="cree(signupF)">
        <div>
<label for="name" class="form-label"  >Name:</label>
<input type="text" id="name" class="form-control" placeholder="name" name="name" ngModel required>
</div>
<div>
<label for="email" class="form-label">📧Email:</label>
<input type="email" class="form-control" id="email" placeholder="name@example.com" name="email" ngModel required>
</div>
<div>
<label for="password" class="form-label">🔐Password:</label>
<input type="password" id="password" class="form-control" placeholder="password" name="password" ngModel required>
</div>
<div class=" text-center">
<button  type="submit" class="m-2  btn btn-primary">sign up</button>
</div>
    </form>
</div>
